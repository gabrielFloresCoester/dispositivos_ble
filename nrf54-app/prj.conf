#
# Coester - SIM Connect (Gateway)
#

# Logger module
CONFIG_LOG=y

# Button and LED library
CONFIG_DK_LIBRARY=y

# --- Bluetooth LE: papel multi-role (Peripheral + varios Central) ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_DEVICE_NAME="Coester_Gateway"

# Nome anunciado configuravel pela propria interface web. Tentativa
# inicial (v1) usava so a Device Name padrao do GAP (servico 0x1800,
# characteristic 0x2A00) pra leitura+escrita, sem opcode customizado -
# revertido por dois motivos confirmados em campo:
#   1. Escrita nela e bloqueada por alguns navegadores/SO (Web
#      Bluetooth no Windows recusa - confirmado; escrita direta via
#      nRF Connect funciona, entao nao e o firmware).
#   2. bt_set_name() sozinho NAO persiste de forma confiavel neste
#      projeto: bt_settings_store_name() (chave embutida "bt/name" do
#      proprio Zephyr) reporta sucesso, mas o valor nao sobrevive a
#      reboot - enquanto a allow-list, no mesmo backend ZMS so que sob
#      chave nossa ("coe/al"), sobrevive normal. Bug/aspereza especifica
#      dessa integracao "bt/name" + ZMS, nao investigado a fundo.
#
# Solucao: characteristic GAP continua so LEITURA (funciona bem, e o
# navegador ja usa pra mostrar o nome atual). A ESCRITA agora e um
# opcode na nossa propria Gateway Control (GATEWAY_CTRL_SET_NAME,
# main.c) que persiste explicitamente, do nosso jeito, com o mesmo
# padrao ja confiavel da allow-list.
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_GATT_WRITABLE=n
CONFIG_BT_DEVICE_NAME_MAX=32

# TETO DO CONTROLADOR: o SoftDevice Controller da Nordic suporta no
# maximo 20 conexoes simultaneas somando TODOS os papeis:
#   1 interface (Peripheral) + 19 atuadores (Central) = 20
CONFIG_BT_MAX_CONN=20
CONFIG_BT_MAX_PAIRED=20

# CONFIG_BT_MAX_CONN acima e so a SOMA de todos os papeis - quantos
# podem ser Peripheral AO MESMO TEMPO e um orcamento SEPARADO
# (default 1 se nao setado). So existe 1 interface por vez, entao 1 e
# suficiente - explicito aqui, e nao no default implicito, para nao ser
# reduzido/alterado sem querer numa limpeza futura de Kconfig. Se isto
# ficar sem recurso (0 livre) enquanto a interface JA esta conectada, a
# advertising falha com HCI status 0x0d ("Limited Resources") - foi
# exatamente o que causava o loop de retentativa visto em campo quando
# um atuador reciclava a conexao com a interface ja conectada; a guarda
# em adv_work_handler() (main.c) agora evita a tentativa nesse caso, mas
# o numero fica explicito aqui pela mesma razao.
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=1

# Necessario para atuar como GATT Client
CONFIG_BT_GATT_CLIENT=y

# Modulo de descoberta de servicos GATT (actuator_client.c)
CONFIG_BT_GATT_DM=y

# Modulo de scan da NCS. Com os Kits B e C aposentados sobrou um unico
# filtro: o UUID do servico proprietario do atuador.
# CONFIG_BT_SCAN_UUID_CNT tem default 0 - sem reservar,
# bt_scan_filter_add() retorna -ENOMEM.
CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_UUID_CNT=1

# =====================================================================
# MTU - a parte mais importante desta revisao
# =====================================================================
#
# Sem estas opcoes o ATT MTU fica no default (23), ou seja 20 bytes
# uteis por notify. As respostas do protocolo proCo sao:
#
#   posicao/torque ....  18 bytes  (8 header + 10 payload)  -> cabia
#   firmware ..........  ~18 bytes                          -> cabia
#   dados gerais ......  42 bytes  (8 + 34)                 -> NAO cabia
#   curva .............  72 bytes  (8 + 64)                 -> NAO cabia
#   alarmes ........... 126 bytes  (8 + 118)                -> NAO cabia
#
# Isso explica por que a leitura de posicao/torque funcionava e as
# demais nao: era exatamente a unica que cabia em 20 bytes. O
# truncamento do bt_gatt_notify e silencioso, sem erro nenhum.
#
# Sao DOIS saltos, e os dois precisam de MTU grande:
#   atuador -> Gateway    (Gateway e Central: precisa INICIAR o MTU
#                          exchange, dai o AUTO_UPDATE_MTU abaixo)
#   Gateway -> navegador  (o navegador inicia; o Gateway so precisa de
#                          buffer)

CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# Data Length Extension - sem isso o MTU maior e negociado mas cada
# pacote continua fragmentado em 27 bytes de PDU, o que funciona porem
# multiplica a latencia de cada resposta grande.
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Mais buffers de TX: com ate 6 links centrais + a interface, o default
# vira gargalo quando varias respostas grandes chegam juntas.
#
# ATENCAO ao invariante do Zephyr:
#   CONFIG_BT_BUF_EVT_RX_COUNT > CONFIG_BT_BUF_ACL_TX_COUNT
# Cada pacote ACL enviado ao controlador gera eventos HCI de volta
# (Number of Completed Packets, principalmente). Se o host puder ter
# mais pacotes em voo do que buffers para receber os eventos que os
# liberam, ele trava esperando um buffer que so seria liberado por um
# evento sem onde chegar. Subir o ACL_TX_COUNT sem subir o EVT_RX_COUNT
# junto quebra o build com "Increase Event RX buffer count...".
# O aviso "Num of Controller's ACL packets != ACL bt_conn_tx contexts"
# no boot vem da diferenca entre estes contadores do host e o numero de
# pacotes ACL do controlador. E so um aviso de dimensionamento, nao um
# erro - mas subir o lado do controlador junto reduz o gargalo de TX
# quando varias respostas grandes chegam ao mesmo tempo.
CONFIG_BT_ATT_TX_COUNT=8
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_CTLR_SDC_TX_PACKET_COUNT=8

# Stacks: scan + discovery + ate 19 conexoes centrais simultaneas
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096

# Heap: bt_gatt_dm e as multiplas conexoes centrais alocam buffers
CONFIG_HEAP_MEM_POOL_SIZE=8192

# =====================================================================
# PHY 2M
# =====================================================================
#
# Dobra a taxa no ar, reduzindo pela metade o tempo de radio de cada
# evento de conexao. Com 16 links disputando um unico radio, isso nao e
# otimizacao de luxo - e o que faz caber. O pedido e feito por link em
# actuator_client.c; se o atuador nao suportar, fica em 1M sem drama.
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_PHY_UPDATE=y

# =====================================================================
# Persistencia da allow-list
# =====================================================================
#
# Para o nRF54L a Nordic orienta usar ZMS (Zephyr Memory Storage), nao
# NVS - o RRAM tem caracteristicas de escrita diferentes do flash. Se
# voce vier de um projeto com CONFIG_SETTINGS_NVS, esta e a migracao.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_ZMS=y
CONFIG_ZMS_LOOKUP_CACHE=y
CONFIG_ZMS_LOOKUP_CACHE_SIZE=128
CONFIG_ZMS_LOOKUP_CACHE_FOR_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# =====================================================================
# Agenda de radio com muitos links
# =====================================================================
#
# Limita quanto tempo um unico evento de conexao pode ocupar o radio.
# Com o default (7500 us), um link ocupado em coleta de curvas pode
# atrasar os outros 15. Reduzir aperta a coleta em lote, mas mantem o
# polling periodico regular - que e o comportamento que a demonstracao
# precisa.
#
# NOME DE KCONFIG VARIA ENTRE VERSOES DA NCS. Se o build reclamar de
# simbolo indefinido, comente esta linha: o padrao funciona, so fica
# menos justo com muitos atuadores simultaneos.
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=4000

# Descomente para ver o hexdump dos frames crus do atuador no RTT
# CONFIG_LOG_DEFAULT_LEVEL=4

# =====================================================================
# Link UART com o nRF9151 (uart_link.c)
# =====================================================================
#
# API assincrona de UART (uart_callback_set/uart_tx/uart_rx_enable) -
# mesma usada em exercises/uart-link. Ausente por padrao neste app
# porque ate a Fase 3 ele nao tinha nenhuma UART dedicada alem do
# console.
CONFIG_UART_ASYNC_API=y

# Recepcao confiavel da UARTE no nRF54L/H sem hardware flow control -
# ver nota grande no overlay de board (nrf54lm20dk_..._cpuapp_ns.overlay)
# sobre o achado em bancada (2026-08-13). Dedica TIMER20 pra contar
# bytes recebidos, evitando a perda/corrupcao de byte que a troca de
# buffer por timeout de inatividade pode causar sob latencia de
# interrupcao maior (radio BLE competindo por CPU).
CONFIG_UARTE_NRFX_UARTE_COUNT_BYTES_WITH_TIMER=y

# =====================================================================
# Sensor de posicao (potenciometro sobre ADS1000, I2C - position_sensor.c)
# =====================================================================
CONFIG_I2C=y

# Timeout por transacao I2C (default do Zephyr: 500ms) - apertado pra
# ficar mais perto da robustez do fwBLE original (TIMEOUT_TRANSACTION_
# DEFAULT=15ms em proCo/comScan.c): se uma transacao travar de verdade
# (barramento preso), o poller do sensor (ads1000.c/torque_onoff_
# sensor.c, todos na mesma fila - ver sensor_workq.c) fica bloqueado
# so' 100ms por tentativa em vez de 500ms, antes de i2c_bus_health.c
# tentar destravar o barramento - ver docs/SENSORES_I2C.md.
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=100

# Watchdog (src/watchdog.c) - task_wdt com o WDT31 como fallback de
# hardware. Motor acionado direto por GPIO: se o firmware travar com um
# pino ligado, o watchdog desliga o motor e reinicia a placa.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
# Causa do ultimo reset no log de boot (saber se foi o watchdog).
CONFIG_HWINFO=y
# sys_reboot() no callback do canal estourado.
CONFIG_REBOOT=y

# Registro de eventos (src/actuator_regevent.c) na flash SPI externa
# (MX25R6435F do DK, particao event_log no overlay da placa). FLASH e
# FLASH_MAP ja estao ligados acima (settings/ZMS).
CONFIG_SPI=y
CONFIG_SPI_NOR=y
