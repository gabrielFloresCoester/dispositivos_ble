CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Recepcao confiavel do uart1 (link com o nRF54) sem hardware flow
# control - achado em bancada (2026-08-13): o nRF54 sozinho ja tinha
# esse problema documentado (ver nrf54-app/prj.conf), mas depois de
# corrigir o lado do 54 o 91 continuou reportando UART_RX_STOPPED
# reason=4/CRC invalido ao receber DO 54 - ou seja, o uart1 do 91 tem a
# mesma fraqueza generica de recepcao (documentada pela Nordic pra serie
# nRF52/53/91, mecanismo diferente do nRF54L/H: aqui e' Kconfig puro,
# sem propriedade "timer" no devicetree). TIMER2 escolhido por estar
# livre (TIMER0/1/2 todos "disabled" no dts nativo; o tick do sistema
# usa o RTC, nao essas TIMER).
CONFIG_UART_1_NRF_HW_ASYNC=y
CONFIG_UART_1_NRF_HW_ASYNC_TIMER=2

# =====================================================================
# Integracao MQTT (docs/PROTOCOLO_91_MQTT.md) - base reaproveitada de
# C:\NordicAcademy\cell-fund\l4\l4_e2 (Nordic Academy, Cellular IoT
# Fundamentals, Licao 4 Exercicio 2)
# =====================================================================

# Sem isto, todo LOG_INF/LOG_WRN/LOG_ERR (mqtt_client.c, e tambem os
# logs INTERNOS de nrf_modem_lib/lte_lc/mqtt_helper) vira no-op em
# silencio na compilacao - achado em bancada (2026-08-14): o app nunca
# tinha usado o subsistema de Log antes (uart_link.c/main.c sao so
# printk), entao isso nunca tinha sido habilitado.
CONFIG_LOG=y

# Rede via modem (offloaded sockets - nao pilha de rede nativa do
# Zephyr, o modem cuida disso)
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS=y

CONFIG_NRF_MODEM_LIB=y

CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT=y

# Desligado por padrao (sem "default y" no Kconfig da lib) - sem isto
# LTE_LC_EVT_MODEM_EVENT nunca chega, e diagnosticos uteis tipo
# RESET_LOOP/NO_IMEI/RF_CAL_NOT_DONE ficam invisiveis se o registro de
# rede travar (achado em bancada, 2026-08-15).
CONFIG_LTE_LC_MODEM_EVENTS_MODULE=y

CONFIG_MQTT_HELPER=y
CONFIG_MQTT_CLEAN_SESSION=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MBEDTLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MQTT_HELPER_SEC_TAG=24
CONFIG_MODEM_KEY_MGMT=y

# Memoria - modem+MQTT+JSON pedem mais que os defaults minimos que a
# Fase 4 (so UART) usava
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
